# neural-network-practices
# Five classical neural network training practices on one shared task:
# find the letter X in a dataset of rendered letters.
[project]
name = "neuro-practics"
version = "0.2.0"
description = "Hebb / Delta / Backprop / RBF / SOM — implementations and benchmark"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pillow>=10.0",
]

[project.optional-dependencies]
torch = ["torch>=2.3"]
all = ["neuro-practics[torch]"]

[tool.uv]
package = false
